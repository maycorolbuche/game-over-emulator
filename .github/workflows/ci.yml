name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "CI / Validação"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.x'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar catálogo
        run: npm run check:catalog
      - name: Testar validador
        run: npm run test:catalog
      - name: Testar ciclo de vida do emulador
        run: npm run test:emulator
      - name: Testar rotas e navegação
        run: npm run test:routes
      - name: Testar salvamentos
        run: npm run test:saves
      - name: Testar transferência de saves
        run: npm run test:transfer
      - name: Testar arquivos de estado do emulador
        run: npm run test:state-files
      - name: Validar perfis de controles
        run: npm run test:controls
      - name: Testar cheats
        run: npm run test:cheats
      - name: Testar turbo por Shift
        run: npm run test:turbo
      - name: Testar entradas e layout mobile
        run: npm run test:mobile
      - name: Testar instalação e cache PWA
        run: npm run test:pwa
      - name: Gerar build
        run: npm run build
